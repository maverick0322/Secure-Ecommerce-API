# =====================================================================
# Configuración del Análisis Estático de Código para SonarQube Cloud
# Repositorio: maverick0322/Secure-Ecommerce-API
# =====================================================================

sonar.projectKey=maverick0322_Secure-Ecommerce-API
sonar.organization=maverick0322

# Rutas de análisis
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusiones para ignorar artefactos temporales, dependencias y documentación
sonar.exclusions=**/node_modules/**,coverage/**,docs/**,restclient/**,uploads/**,log/**,swagger-output.json,bd.sql

# Integración del reporte de cobertura de pruebas unitarias y de integración (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificación de caracteres estándar
sonar.sourceEncoding=UTF-8

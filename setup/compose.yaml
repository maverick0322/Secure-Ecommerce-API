services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MYSQL_ROOT_HOST: localhost
    secrets: [mysql_root]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ../.secrets/mysql/initial-schema.sql
        target: /docker-entrypoint-initdb.d/01-team-schema.sql
        read_only: true
        bind: { create_host_path: false }
    networks: [database]

  redis:
    image: redis:8.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    secrets: [redis_acl, redis_ca, redis_server_cert, redis_server_key, redis_health_password]
    ports:
      - "127.0.0.1:${TEAM_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - type: bind
        source: ../config/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind: { create_host_path: false }
    networks: [sessions]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]

  app:
    build: ..
    ports:
      - "127.0.0.1:${TEAM_API_PORT}:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: secure_ecommerce
      DB_USER: ecommerce_app
      DB_PASSWORD: ${TEAM_DB_PASSWORD:?}
      DB_EXPECTED_UUID: ${TEAM_DB_UUID:?}
      SERVER_PORT: "3000"
      SERVER_HOST: 0.0.0.0
      NODE_ENV: development
      JWT_SECRET: ${TEAM_JWT_SECRET:?}
      JWT_RS256_ISSUER: ${JWT_RS256_ISSUER:?}
      JWT_RS256_AUDIENCE: ${JWT_RS256_AUDIENCE:?}
      JWT_RS256_ACTIVE_KID: ${JWT_RS256_ACTIVE_KID:?}
      JWT_RS256_PRIVATE_KEY_PATH: /run/secrets/access_private_key
      JWT_RS256_PUBLIC_KEYS_PATH: /run/secrets/access_public_manifest
      AUTH_CREDENTIAL_VERSION_KEY_PATH: /run/secrets/auth_credential_key
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: "6379"
      AUTH_REDIS_TLS: "true"
      AUTH_REDIS_USER: auth_session_app
      AUTH_REDIS_NAMESPACE: secure-ecommerce-auth
      AUTH_REDIS_PASSWORD_PATH: /run/secrets/redis_app_password
      AUTH_REDIS_CA_PATH: /run/secrets/redis_ca
      AUTH_REDIS_STATE_PATH: /run/redis-state/state.json
      GMAIL_CLIENT_PATH: /run/secrets/gmail/client.json
      GMAIL_TOKEN_PATH: /run/secrets/gmail/token.json
      GMAIL_REDIRECT_URI: http://localhost:3001/oauth2/callback
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081}
    secrets: [redis_app_password, redis_ca, access_private_key, access_public_manifest, auth_credential_key]
    volumes:
      - api_log:/usr/src/app/log
      - type: bind
        source: ../.secrets/auth/public-keys
        target: /run/auth/public-keys
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ../.secrets/redis/state
        target: /run/redis-state
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ../.secrets/gmail
        target: /run/secrets/gmail
        read_only: true
        bind: { create_host_path: false }
    networks: [database, sessions, outbound]
    security_opt: [no-new-privileges:true]

volumes:
  mysql_data:
  redis_data:
  api_log:
networks:
  database: { internal: true }
  sessions:
  outbound:
secrets:
  mysql_root: { file: ../.secrets/mysql/root-password }
  redis_acl: { file: ../.secrets/redis/users.acl }
  redis_health_password: { file: ../.secrets/redis/health-password }
  redis_app_password: { file: ../.secrets/redis/app-password }
  redis_ca: { file: ../.secrets/redis/ca.crt }
  redis_server_cert: { file: ../.secrets/redis/server.crt }
  redis_server_key: { file: ../.secrets/redis/server.key }
  access_private_key: { file: ../.secrets/auth/access-private.pem }
  access_public_manifest: { file: ../.secrets/auth/public-keys.docker.json }
  auth_credential_key: { file: ../.secrets/auth/credential-version.key }
